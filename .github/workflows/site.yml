name: Publicar o arcade
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['page/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teco-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Montar o site com a última versão estável
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
          tag=$(jq -er .tag_name "$RUNNER_TEMP/release.json")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p site/game
          cp -R page/. site/
          if jq -e '.assets[] | select(.name=="TECO-web.zip")' "$RUNNER_TEMP/release.json" > /dev/null; then
            gh release download "$tag" -p 'TECO-web.zip' -D "$RUNNER_TEMP"
            unzip -q "$RUNNER_TEMP/TECO-web.zip" -d site/game
          else
            # Releases que só têm instalador também levam o renderer completo.
            exe="TECO-Setup-${tag#v}.exe"
            gh release download "$tag" -p "$exe" -D "$RUNNER_TEMP"
            7z e -y "-o$RUNNER_TEMP/teco" "$RUNNER_TEMP/$exe" '$PLUGINSDIR/app-64.7z'
            7z x -y "-o$RUNNER_TEMP/teco" "$RUNNER_TEMP/teco/app-64.7z" 'resources/app.asar'
            npx --yes --package=@electron/asar@4.3.4 asar extract "$RUNNER_TEMP/teco/resources/app.asar" "$RUNNER_TEMP/renderer"
            cp -R "$RUNNER_TEMP/renderer/dist/." site/game/
          fi
          test -s site/game/index.html
          test -s site/game/icone.png
          compgen -G 'site/game/assets/*.js' >/dev/null
          test -z "$(find site -name '*.asar' -o -name '*.cjs' -o -name '*.map' -o -type l)"
          sed -i "s/__RELEASE__/$tag/g" site/index.html site/site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
